<html lang="en">
<head>
<meta charset="utf-8">
<title>Adinfinitium · Live: our render + Basilisk Vizard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: "Instrument Sans"; src: url("../vendor/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"), url("../ui/vendor/fonts/instrument-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; }
@font-face { font-family: "JetBrains Mono"; src: url("../vendor/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"), url("../ui/vendor/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
:root { --line: rgba(142,182,155,.16); --text: #FFFFFF; --dim: rgba(255,255,255,.62); --blue: #8EB69B; --bl: #DAF1DE; --or: #DAF1DE; --ease: cubic-bezier(.16, 1, .3, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000000; color: var(--text); font: 14px/1.4 "Instrument Sans", -apple-system, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
.n { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; font-weight: 500; }
#top { position: fixed; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 22px; padding: 0 22px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.9); z-index: 3; }
#top b { font-weight: 650; font-size: 15px; } #live { color: var(--dim); font-size: 13px; flex: 1; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 8px; vertical-align: 1px; } .dot.on { background: var(--or); box-shadow: 0 0 10px var(--or); }
button { font: inherit; font-size: 13px; color: var(--text); background: rgba(22,56,50,.6); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .25s var(--ease); }
button:hover { background: rgba(35,83,71,.8); color: var(--bl); } button.on { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
#ctl { position: fixed; right: 18px; top: 84px; z-index: 4; display: flex; gap: 8px; }
#wrap { position: fixed; left: 0; right: 0; top: 74px; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; transition: all .5s var(--ease); }
.pane { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #000000; }
.pane .tag { position: absolute; left: 14px; top: 12px; z-index: 2; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; background: rgba(0,0,0,.72); border: 1px solid var(--line); pointer-events: none; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000000; }
#pick { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); }
#pick p { max-width: 420px; margin: 0 auto 16px; }
/* picture-in-picture: Vizard small in the corner of our render */
body.pip #wrap { grid-template-columns: 1fr; } body.pip #viz { position: fixed; right: 26px; bottom: 26px; width: 34vw; height: calc(34vw * 9 / 16); z-index: 2; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
</style>
<link rel="stylesheet" href="/banner.css">
</head>
<body>
<div id="adb" data-screen="Our render + Basilisk Vizard" style="position:fixed;left:0;right:0;top:0;z-index:3"></div>
<div id="ctl"><button id="layout">Picture in picture</button><button id="pickBtn">Choose Vizard window</button></div>
<div id="wrap">
  <div class="pane" id="ours"><span class="tag">Our render · three.js</span><iframe id="frame" src="./?live=1&clean=1" title="Our 3D view"></iframe></div>
  <div class="pane" id="viz"><span class="tag">Basilisk · Vizard (live)</span><video id="vid" autoplay muted playsinline></video>
    <div id="pick"><div><p>Vizard runs as its own app. Choose its window once and it is shown here, live, next to our render.</p><button id="pick2">Choose Vizard window</button></div></div></div>
</div>
<script src="/banner.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  async function pick() {
    try {
      const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60, cursor: 'never' }, audio: false, preferCurrentTab: false, selfBrowserSurface: 'exclude' });
      $('vid').srcObject = s; $('pick').style.display = 'none';
      s.getVideoTracks()[0].addEventListener('ended', () => { $('vid').srcObject = null; $('pick').style.display = ''; });
    } catch (e) { /* the person closed the picker */ }
  }
  $('pickBtn').onclick = pick; $('pick2').onclick = pick;
  $('layout').onclick = () => { document.body.classList.toggle('pip'); $('layout').classList.toggle('on', document.body.classList.contains('pip')); };
})();
</script>
</body>
</html>
