<!doctype html>
<!-- Renders assets/models/lander.glb once on a transparent background, for assets/img/lander_icon.png
     (the gauge marker fallback for reduced motion / no WebGL). Screenshot it with headless Chrome:
     chrome --headless=new --default-background-color=00000000 --window-size=512,384 \
       --screenshot=icon.png --virtual-time-budget=6000 http://localhost:8780/tools/render_lander_icon.html
     then downscale to 128 x 96 (sips -z 96 128 icon.png). -->
<html><head><meta charset="utf-8"><title>lander icon</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight, false);
r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.3;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xc4d2ff, 0x6a645c, 1.3));
const sun = new THREE.DirectionalLight(0xfff1dd, 3.6); sun.position.set(6, 4, 5); scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fdcff, 1.2); rim.position.set(-6, 3, -6); scene.add(rim);
const cam = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.1, 100);
new GLTFLoader().load('../assets/models/lander.glb', g => {
  const m = g.scene, piv = new THREE.Group(); piv.add(m); scene.add(piv);
  const ln = m.getObjectByName('lander'); if (ln) ln.rotation.y = Math.PI / 2;   // same orientation as the site scene
  const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3());
  m.position.sub(c); piv.rotation.y = 1.2; piv.rotation.x = 0.04;
  const sph = new THREE.Box3().setFromObject(piv).getBoundingSphere(new THREE.Sphere());
  cam.aspect = canvas.clientWidth / canvas.clientHeight; cam.updateProjectionMatrix();
  const fit = sph.radius / Math.sin(THREE.MathUtils.degToRad(11)) * 0.82;
  cam.position.set(0, fit * 0.18, fit); cam.lookAt(0, 0, 0);
  r.render(scene, cam); document.title = 'ready';
});
</script></body></html>
