<!doctype html><html><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>moonfx test</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>html,body{margin:0;height:100%;background:#262624;color:#F0EEE6;font:13px monospace;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#l{position:fixed;left:12px;top:10px}</style>
</head><body><div id="l"></div><canvas id="c"></canvas>
<script type="module">
// tools/moonfx_test.html?seg=scan&p=0.5   (no p: loops 0..1 every 6 s). seg=all shows every element at p.
import * as THREE from 'three';
import { createMoonFX } from './js/moonfx.js';
const q = new URLSearchParams(location.search), seg = q.get('seg') || 'scan', fixedP = q.has('p') ? +q.get('p') : null;
const canvas = document.getElementById('c'), r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setClearColor(0x262624);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
const SUN = new THREE.Vector3(1, 0.16, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xfff1dd, 4); sun.position.copy(SUN).multiplyScalar(100); scene.add(sun, new THREE.AmbientLight(0xc9c6bf, 0.45));
const mat = new THREE.MeshStandardMaterial({ roughness: 1, bumpScale: 1.5 });
const moon = new THREE.Mesh(new THREE.SphereGeometry(30, 160, 100), mat); scene.add(moon);
const tl = new THREE.TextureLoader();
tl.load('assets/img/moon_color_2k.jpg', t => { t.colorSpace = THREE.SRGBColorSpace; mat.map = t; mat.needsUpdate = true; });
tl.load('assets/img/moon_bump_1k.jpg', t => { mat.bumpMap = t; mat.needsUpdate = true; });
const fx = createMoonFX(THREE, scene, moon, { sunDir: SUN, radius: 30 });
moon.quaternion.copy(fx.orientToSite(-86.5, 20, new THREE.Vector3(0, 0.55, 1)));   // south-pole region towards the camera
const look = new THREE.Vector3(0, 0.55, 1).normalize().multiplyScalar(30);
cam.position.copy(look).add(new THREE.Vector3(0, 9, 26)); cam.lookAt(look.clone().add(new THREE.Vector3(0, 2, 0)));
const names = seg === 'all' ? fx.names : [seg];
document.getElementById('l').textContent = names.join(', ') + (fixedP != null ? ' p=' + fixedP : '');
function size() { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();
const t0 = performance.now();
function frame() {
  const p = fixedP != null ? fixedP : ((performance.now() - t0) / 6000) % 1;
  for (const n of names) fx[n] && fx[n].update(p);
  r.render(scene, cam); requestAnimationFrame(frame);
}
frame(); setInterval(() => { if (fixedP != null) { for (const n of names) fx[n] && fx[n].update(fixedP); r.render(scene, cam); } }, 200);
</script></body></html>
